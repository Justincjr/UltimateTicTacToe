<h1>Current Player: {{ player }}</h1>

<button mat-raised-button color="primary" (click)="newGame()">
  Start New Game
</button>

<h2 *ngIf="winner">
  Player {{ winner }} won the game!
</h2>

<main class="global-board-grid">
  <app-board
    *ngFor="let board of boards; let i = index"
    [squares]="board.squares"
    [active]="activeBoardIndex === undefined || activeBoardIndex === i"
    (moveMade)="handleMove(i, $event)"
  >
  </app-board>
</main>
